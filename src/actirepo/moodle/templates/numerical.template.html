<style>
    .img-fluid {
        max-width: calc(100% - 15px);
        height: auto;
        vertical-align: text-bottom;
        border-style: none;
        box-sizing: border-box;
        display: inline-block;
        margin: 0px 7.5px;
    }
</style>
<div
    style="color:rgb(0, 26, 30);background-color:rgb(231, 243, 245);border-color:rgb(184, 220, 226);position:relative;padding:12px 20px;margin-bottom:16px;border:0px solid rgb(184, 220, 226);border-radius:4px;box-sizing:border-box; width: 800px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;font-size:15px;line-height:22.5px;">
    <div style="margin-bottom:15px;box-sizing:border-box;">{{ question.statement }}</div>
    <div style="margin:10.5px 0px 4.5px;box-sizing:border-box;">
        <label style="box-sizing:border-box;">Respuesta:
            <input type="text" value="{{ question.first_answer }}" size="30" style="display:inline-block;vertical-align:baseline;height:32px;padding:4px 8px;margin:2px 4px;font-size:15px;font-weight:400;line-height:22.5px;color:rgb(73, 80, 87);background-color:rgb(255, 255, 255);border:1px solid rgb(143, 149, 158);border-radius:4px;box-sizing:border-box;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;" />
            {% if question.units %}<select style="display:inline-block;vertical-align:baseline;height:32px;padding:4px 8px;margin:2px 4px;font-size:15px;font-weight:400;line-height:22.5px;color:rgb(73, 80, 87);background-color:rgb(255, 255, 255);border:1px solid rgb(143, 149, 158);border-radius:4px;box-sizing:border-box;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;">{% for unit in question.units %}<option>{{ unit }}</option>{% endfor %}</select>{% endif %}
        </label>
    </div>
</div>
