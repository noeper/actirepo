<style>
    .img-fluid {
        max-width: calc(100% - 15px);
        height: auto;
        vertical-align: text-bottom;
        border-style: none;
        box-sizing: border-box;
        display: inline-block;
        margin: 0px 7.5px;
    }
</style>
<div
    style="color:rgb(0, 26, 30);background-color:rgb(231, 243, 245);border-color:rgb(184, 220, 226);position:relative;padding:12px 20px;margin-bottom:16px;border:0px solid rgb(184, 220, 226);border-radius:4px;box-sizing:border-box; width: 800px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;font-size:15px;line-height:22.5px;">
    <div style="margin-bottom:15px;box-sizing:border-box;">{{ question.statement }}</div>
    <ul style="list-style:none;margin:0px;padding:0px;box-sizing:border-box;{% if question.horizontal %}display:flex;flex-wrap:wrap;{% endif %}">
        {% for answer in question.answers %}
        <li style="display:flex;align-items:center;margin:4px 8px 4px 0px;padding:8px 12px;background-color:rgb(255, 255, 255);border:1px solid rgb(143, 149, 158);border-radius:4px;box-sizing:border-box;">
            <span style="color:rgb(143, 149, 158);margin-right:10px;">&#8942;&#8942;</span>
            {% if answer.number %}<span style="min-width:22.5px;">{{ answer.number }}</span>{% endif %}
            <span>{{ answer.text }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
